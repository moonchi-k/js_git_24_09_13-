<head>

        }

        .con_wrap {
            width: 200px;
            height: 400px;
            /* border: 1px solid #fff; */

            margin: auto 0;
            padding: 30px;
            border-radius: 20px;
            background-color: rgba(100, 100, 100, 0.3);
        }

    </style>
</head>
<body>

    <div class="wrap">

            <h2>날씨</h2>

            <div class="city">

            </div>
       </div>
        
    </div>

    <script src = "js/main.js"></script>
